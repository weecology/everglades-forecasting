# =============================================================================
# WADING BIRD FORECAST CONFIGURATION
# config.yml — loaded via config::get(config = "profile_name")
#
# Profile hierarchy (config package inheritance):
#   default  <-- all profiles inherit from this
#   testing  <-- fast-iteration profiles inherit from this
#   production / production_subregion  <-- full production runs
#
# Key design notes:
#   - adapt_delta and max_treedepth live here and are passed to mvgam()
#     via config$adapt_delta / config$max_treedepth in fit_mvgam_*.R
#   - remote_url for water data lives under water$remote_url
#   - models lists drive which fit_mvgam_* / fable functions are called
#   - cv_windows: null = all available windows
#   - workers: null = auto-detect available cores
#   - ordinal_breaks: three cut-points producing four ordinal categories
#     (below-low / low-mid / mid-high / above-high)
# =============================================================================

# -----------------------------------------------------------------------------
# DEFAULT — base settings inherited by all profiles
# -----------------------------------------------------------------------------
default:

  # Water data remote source.
  # Set to null to use local cache only (safe for HiPerGator runs).
  water:
    remote_url: null

  # ---------------------------------------------------------------------------
  # Spatial
  # ---------------------------------------------------------------------------
  spatial:
    level: system                   # "system" | "subregion" | "colony"
    forecast_totals: false          # true = collapse all species into "Total"
    include_species: "top6"         # "top6" | "all" | ["wost", "whib", ...]
    include_unknowns: false         # include generic codes (unkn, smwh, ...)
    fill_missing: true              # fill gaps with fill_value
    fill_value: 0
    min_years_required: 10          # drop spatial units with fewer years
    exclude_regions: []
    include_regions: []
    exclude_colonies: []
    include_colonies: []
    run_by_region: false            # true = separate model per region (slow)

  # ---------------------------------------------------------------------------
  # Models
  # Available mvgam:  baseline, ar, ar_exog, ar_exog_plus,
  #                   species_specific, trait, trait2
  # Available fable:  baseline, arima, tslm, arima_exog, gam
  # ---------------------------------------------------------------------------
  models:
    mvgam:
      - baseline
      - ar
      - ar_exog
      - ar_exog_plus
      - species_specific
      - trait
      - trait2
    fable:
      - baseline
      - arima
      - tslm
      - arima_exog
      - gam

  run_mvgam: false
  run_fable: true

  # ---------------------------------------------------------------------------
  # MCMC (mvgam / Stan)
  # ---------------------------------------------------------------------------
  family: "nb"
  chains: 4
  burnin: 2000
  samples: 2000
  adapt_delta: 0.95
  max_treedepth: 10

  # ---------------------------------------------------------------------------
  # Cross-validation
  # ---------------------------------------------------------------------------
  train_years: 20
  test_years: 2
  forecast_horizon: 2
  cv_windows: null                  # null = all available windows

  # ---------------------------------------------------------------------------
  # Evaluation
  # ---------------------------------------------------------------------------
  use_ordinal: true
  ordinal_breaks: [0.33, 0.50, 0.67]
  sliding_window_breaks: true       # recompute breaks inside each CV window
  ordinal_years: "All"              # "All" or integer = use last N years only
  data_type: "observed"

  # ---------------------------------------------------------------------------
  # Parallel processing
  # ---------------------------------------------------------------------------
  parallel:
    enabled: true
    workers: null

  # ---------------------------------------------------------------------------
  # Caching
  # ---------------------------------------------------------------------------
  cache:
    data: true
    models: false
    force_refit: false

  # ---------------------------------------------------------------------------
  # Plotting
  # ---------------------------------------------------------------------------
  plots:
    native_mvgam: true              # save mvgam native forecast plots
    native_fable: true              # save fable native forecast plots
    forecast_timeseries: true
    generate_forecast_pdfs: true
    ts_models: ["baseline", "ar", "trait"]
    ts_species: ["gbhe", "greg", "rosp", "wost", "whib", "sneg"]
    interval_levels: [80, 95]


# =============================================================================
# TESTING — fast iteration for development
# Inherits default; overrides only what changes.
# =============================================================================
testing:
  inherits: default

  models:
    mvgam:
      - baseline
      - ar
    fable: []

  run_mvgam: true
  run_fable: false

  chains: 2
  burnin: 500
  samples: 500
  adapt_delta: 0.90

  train_years: 15
  test_years: 2
  cv_windows: 3

  parallel:
    enabled: true
    workers: 2

  plots:
    native_mvgam: true
    forecast_timeseries: false
    generate_forecast_pdfs: false


# Absolute minimum — one model, one window, sequential.
# Use this first when debugging a new model or data config.
quick_test:
  inherits: testing

  models:
    mvgam:
      - baseline
    fable: []

  chains: 1
  burnin: 250
  samples: 250
  cv_windows: 1

  use_ordinal: false

  parallel:
    enabled: false


# Single CV window, bare-minimum MCMC.
# Useful for checking that a full pipeline run reaches completion.
debug_single_window:
  inherits: quick_test

  train_years: 20
  test_years: 2
  cv_windows: 1

  chains: 1
  burnin: 100
  samples: 100

  cache:
    data: true
    models: false


# Debug parallel behaviour with a small worker count.
debug_parallel:
  inherits: testing

  cv_windows: 4

  parallel:
    enabled: true
    workers: 2

  chains: 1
  burnin: 250
  samples: 250


# =============================================================================
# SPATIAL TESTING
# =============================================================================

# Subregion — hierarchical (single joint model, recommended)
test_subregion:
  inherits: testing

  spatial:
    level: subregion
    min_years_required: 15
    exclude_regions: ["bigcypress", "coastal"]
    run_by_region: false

  models:
    mvgam:
      - baseline
      - ar
    fable: []

  parallel:
    enabled: true
    workers: 4


# Subregion — separate model per region (slow, for comparison only)
test_subregion_separate:
  inherits: test_subregion

  spatial:
    run_by_region: true

  models:
    mvgam:
      - baseline
      - ar
    fable: []


# Colony — hierarchical
test_colony:
  inherits: testing

  spatial:
    level: colony
    min_years_required: 15
    run_by_region: false

  chains: 2
  burnin: 1000
  samples: 1000
  adapt_delta: 0.99

  parallel:
    enabled: true
    workers: 4


# Colony — specific subset of colonies
test_colony_subset:
  inherits: test_colony

  spatial:
    min_years_required: 20
    include_colonies:
      - hidden
      - alley_north
      - 6th_bridge
      - horus
      - lox99


# =============================================================================
# TOTAL-COUNT PROFILES
# Collapses all selected species into a single "Total" series.
# =============================================================================

# Total counts — fable only (fast)
test_totals_fable:
  inherits: default

  spatial:
    level: system
    forecast_totals: true
    include_species: "all"
    include_unknowns: true

  models:
    mvgam: []
    fable:
      - baseline
      - arima
      - tslm
      - arima_exog
      - gam

  run_mvgam: false
  run_fable: true

  train_years: 20
  test_years: 2
  cv_windows: null

  chains: 4
  burnin: 1500
  samples: 1500

  parallel:
    enabled: true
    workers: null


# Total counts — mvgam (gaussian family recommended for aggregated totals)
test_totals_mvgam:
  inherits: default

  spatial:
    level: system
    forecast_totals: true
    include_species: "all"
    include_unknowns: true

  family: "gaussian"

  models:
    mvgam:
      - baseline
      - ar_exog
      - ar_exog_plus
    fable: []

  run_mvgam: true
  run_fable: false

  use_ordinal: true
  train_years: 20
  test_years: 2
  cv_windows: 3

  chains: 2
  burnin: 1000
  samples: 1000

  parallel:
    enabled: false


# Total counts — top-6 species, both frameworks
totals_top6:
  inherits: default

  spatial:
    level: system
    forecast_totals: true
    include_species: "top6"
    include_unknowns: false

  models:
    mvgam:
      - baseline
      - ar
      - ar_exog
      - ar_exog_plus
    fable:
      - baseline
      - arima
      - tslm
      - arima_exog
      - gam

  run_mvgam: true
  run_fable: true

  use_ordinal: true
  train_years: 20
  test_years: 2


# =============================================================================
# MODEL COMPARISON PROFILES
# =============================================================================

# All mvgam models, no fable
compare_mvgam:
  inherits: default

  models:
    mvgam:
      - baseline
      - ar
      - ar_exog
      - species_specific
      - trait
    fable: []

  run_mvgam: true
  run_fable: false

  chains: 2
  burnin: 500
  samples: 500
  cv_windows: 5

  parallel:
    enabled: true
    workers: 4


# All fable models + mvgam baseline for skill reference
compare_fable:
  inherits: default

  models:
    mvgam:
      - baseline
    fable:
      - baseline
      - arima
      - tslm
      - arima_exog
      - gam

  run_mvgam: true
  run_fable: true

  chains: 2
  burnin: 500
  samples: 500
  train_years: 15
  cv_windows: 5

  parallel:
    enabled: true
    workers: 4


# Simple vs complex mvgam
compare_complexity:
  inherits: default

  models:
    mvgam:
      - baseline
      - ar
      - ar_exog
      - trait
    fable: []

  run_mvgam: true
  run_fable: false

  chains: 3
  burnin: 750
  samples: 750
  cv_windows: 5

  parallel:
    enabled: true
    workers: 4

  use_ordinal: true


# =============================================================================
# ORDINAL EVALUATION PROFILES
# =============================================================================

# Skip ordinal scoring (faster runs)
no_ordinal:
  inherits: testing

  use_ordinal: false


# Fixed ordinal breaks derived from all training data
fixed_breaks:
  inherits: testing

  sliding_window_breaks: false
  ordinal_years: "All"


# Ordinal breaks from most recent 5 training years only
recent_breaks:
  inherits: testing

  sliding_window_breaks: false
  ordinal_years: 5


# =============================================================================
# MULTI-SCALE COMPARISON (used by run_all_scales.R)
# Script overrides spatial$level for each scale; other settings are shared.
# =============================================================================

run_all_scales:
  inherits: default

  spatial:
    level: system                   # overridden per scale by the script
    include_species: "top6"
    include_unknowns: false
    min_years_required: 10
    run_by_region: false

  models:
    mvgam:
      - baseline
      - ar
      - ar_exog
      - ar_exog_plus
      - species_specific
      - trait
      - trait2
    fable:
      - baseline
      - arima
      - tslm
      - arima_exog
      - gam

  run_mvgam: true
  run_fable: true

  family: "nb"
  chains: 4
  burnin: 2000
  samples: 2000
  adapt_delta: 0.99
  max_treedepth: 12

  train_years: 20
  test_years: 2
  cv_windows: null

  parallel:
    enabled: true
    workers: null

  cache:
    data: true
    models: false

  use_ordinal: true
  ordinal_breaks: [0.33, 0.50, 0.67]
  sliding_window_breaks: true

  plots:
    forecast_timeseries: false      # skip per-model plots in multi-scale runs


# Fast version for testing the multi-scale script
run_all_scales_test:
  inherits: run_all_scales

  models:
    mvgam:
      - baseline
      - trait
    fable:
      - baseline
      - arima

  chains: 2
  burnin: 500
  samples: 500
  cv_windows: 2

  parallel:
    enabled: false


# Production version
run_all_scales_production:
  inherits: run_all_scales

  chains: 4
  burnin: 3000
  samples: 3000
  adapt_delta: 0.999

  cv_windows: null

  cache:
    models: true


# =============================================================================
# PRODUCTION — full runs
# =============================================================================

production:
  inherits: default

  spatial:
    level: system
    run_by_region: false

  models:
    mvgam:
      - baseline
      - ar
      - ar_exog
      - ar_exog_plus
      - species_specific
      - trait
      - trait2
    fable:
      - baseline
      - arima
      - tslm
      - arima_exog
      - gam

  run_mvgam: true
  run_fable: true

  chains: 4
  burnin: 2000
  samples: 2000
  adapt_delta: 0.99
  max_treedepth: 12

  cv_windows: null

  parallel:
    enabled: true
    workers: null

  cache:
    data: true
    models: true

  use_ordinal: true

  plots:
    native_mvgam: true
    native_fable: true
    forecast_timeseries: true
    generate_forecast_pdfs: true
    ts_models: ["baseline", "ar", "trait"]
    ts_species: ["gbhe", "greg", "rosp", "wost", "whib", "sneg"]
    interval_levels: [80, 95]


production_subregion:
  inherits: production

  spatial:
    level: subregion
    min_years_required: 15
    run_by_region: false


# =============================================================================
# STL DECOMPOSITION — exploratory analysis via stl_exploration.R
# =============================================================================

stl:
  inherits: default

  stl:
    enabled: true
    analyze: "both"               # "birds" | "water" | "both"
    species: null                 # null = all; or ["wost", "whib"]
    water_vars: null              # null = all; or ["init_depth", "recession"]
    window: 5
    output_dir: "results/STL"


stl_birds_only:
  inherits: stl

  stl:
    analyze: "birds"
    species: ["wost", "whib", "greg"]


stl_water_only:
  inherits: stl

  stl:
    analyze: "water"
    water_vars: ["init_depth", "breed_season_depth", "recession", "dry_days"]

# =============================================================================
# END OF CONFIGURATION
# =============================================================================